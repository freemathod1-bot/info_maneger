<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="LinkVault — save and organise your links beautifully."/>
  <title>LinkVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
  /* ══════════════════════════════════════════════════════════
     RESET
  ══════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ══════════════════════════════════════════════════════════
     TOKENS
  ══════════════════════════════════════════════════════════ */
  :root {
    --bg:          #060810;
    --glass:       rgba(255,255,255,0.035);
    --glass-hover: rgba(255,255,255,0.06);
    --glass-b:     rgba(255,255,255,0.07);
    --glass-b2:    rgba(255,255,255,0.12);
    --surface:     #0c0e18;
    --surface2:    #111424;

    /* aurora palette */
    --violet:      #7c6aff;
    --indigo:      #4f6ef7;
    --cyan:        #06d6c8;
    --pink:        #f04f8a;
    --amber:       #f5a623;
    --emerald:     #2dd4a0;
    --red:         #ff5272;

    /* gradient accent */
    --grad:        linear-gradient(135deg, var(--violet), var(--cyan));
    --grad-text:   linear-gradient(135deg, #a78bfa, #38e8d8);
    --grad-btn:    linear-gradient(135deg, #6d58f0, #06d6c8);

    --text:        #eef0f8;
    --text-muted:  #7880a4;
    --text-dim:    #404669;

    --font:  'Inter', system-ui, sans-serif;
    --mono:  'JetBrains Mono', monospace;

    --r:     14px;
    --r-sm:  8px;
    --r-xs:  5px;
    --trans: 0.2s cubic-bezier(.4,0,.2,1);
    --shadow-lg: 0 24px 80px rgba(0,0,0,0.7);
    --shadow-md: 0 8px 32px rgba(0,0,0,0.5);
    --shadow-sm: 0 2px 12px rgba(0,0,0,0.4);
  }

  /* ══════════════════════════════════════════════════════════
     BASE
  ══════════════════════════════════════════════════════════ */
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.55;
    overflow-x: hidden;
  }

  /* ── Ambient orbs ── */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    top: -200px; left: -150px;
    background: radial-gradient(circle, rgba(124,106,255,0.18) 0%, transparent 70%);
    animation: drift1 20s ease-in-out infinite alternate;
  }
  body::after {
    width: 500px; height: 500px;
    bottom: -150px; right: -100px;
    background: radial-gradient(circle, rgba(6,214,200,0.14) 0%, transparent 70%);
    animation: drift2 18s ease-in-out infinite alternate;
  }

  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,40px) scale(1.1); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-50px,-30px) scale(1.08); } }

  /* ══════════════════════════════════════════════════════════
     HEADER
  ══════════════════════════════════════════════════════════ */
  .app-header {
    position: sticky; top: 0; z-index: 200;
    background: rgba(6,8,16,0.75);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid var(--glass-b);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04);
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto; padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .logo { display: flex; align-items: center; gap: 11px; text-decoration: none; }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--grad-btn);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(124,106,255,0.45), 0 0 40px rgba(6,214,200,0.2);
    font-size: 17px; flex-shrink: 0;
  }
  .logo-text {
    font-size: 17px; font-weight: 700; letter-spacing: -0.4px;
    background: var(--grad-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .logo-version {
    font-size: 10px; font-weight: 500; color: var(--text-dim);
    background: var(--glass); border: 1px solid var(--glass-b);
    padding: 2px 7px; border-radius: 99px; font-family: var(--mono);
  }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .count-badge {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--text-muted); background: var(--glass);
    border: 1px solid var(--glass-b); padding: 5px 12px; border-radius: 99px;
    white-space: nowrap;
  }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 20px; border: none; border-radius: var(--r-sm);
    font-family: var(--font); font-size: 13px; font-weight: 600;
    color: #fff; cursor: pointer; white-space: nowrap;
    background: var(--grad-btn);
    box-shadow: 0 0 20px rgba(124,106,255,0.35), 0 4px 16px rgba(0,0,0,0.4);
    transition: transform var(--trans), box-shadow var(--trans), filter var(--trans);
    position: relative; overflow: hidden;
  }
  .btn-primary::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
    pointer-events: none;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 32px rgba(124,106,255,0.5), 0 8px 24px rgba(0,0,0,0.4);
    filter: brightness(1.08);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary svg { width: 14px; height: 14px; }

  /* ══════════════════════════════════════════════════════════
     TOOLBAR
  ══════════════════════════════════════════════════════════ */
  .toolbar {
    background: rgba(8,10,20,0.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--glass-b);
  }
  .toolbar-inner {
    max-width: 1280px; margin: 0 auto; padding: 12px 28px;
    display: flex; align-items: center; gap: 10px;
  }

  /* search */
  .search-wrap { flex: 1; position: relative; min-width: 0; }
  .search-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--text-dim); pointer-events: none;
  }
  .search-input {
    width: 100%; padding: 10px 14px 10px 38px;
    background: var(--glass); border: 1px solid var(--glass-b);
    border-radius: var(--r-sm); color: var(--text); font-family: var(--font);
    font-size: 13px; outline: none;
    transition: border-color var(--trans), background var(--trans), box-shadow var(--trans);
  }
  .search-input:focus {
    border-color: rgba(124,106,255,0.5);
    background: rgba(124,106,255,0.05);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.1);
  }
  .search-input::placeholder { color: var(--text-dim); }

  /* selects & icon buttons */
  .filter-select {
    padding: 10px 12px; background: var(--glass); border: 1px solid var(--glass-b);
    border-radius: var(--r-sm); color: var(--text); font-family: var(--font);
    font-size: 13px; outline: none; cursor: pointer;
    transition: border-color var(--trans);
  }
  .filter-select:focus { border-color: rgba(124,106,255,0.5); }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; background: var(--glass);
    border: 1px solid var(--glass-b); border-radius: var(--r-sm);
    cursor: pointer; color: var(--text-muted); flex-shrink: 0;
    transition: color var(--trans), border-color var(--trans), background var(--trans), box-shadow var(--trans);
  }
  .icon-btn:hover {
    color: var(--cyan); border-color: rgba(6,214,200,0.35);
    background: rgba(6,214,200,0.06);
    box-shadow: 0 0 12px rgba(6,214,200,0.15);
  }
  .icon-btn svg { width: 15px; height: 15px; }

  /* ══════════════════════════════════════════════════════════
     TABLE WRAPPER
  ══════════════════════════════════════════════════════════ */
  .table-wrap {
    max-width: 1280px; margin: 32px auto 80px; padding: 0 28px;
  }

  /* stats bar */
  .stats-bar {
    display: flex; align-items: center; gap: 16px; margin-bottom: 16px;
    padding: 10px 18px;
    background: var(--glass); border: 1px solid var(--glass-b);
    border-radius: var(--r-sm);
  }
  .stat-item { display: flex; align-items: center; gap: 6px; }
  .stat-dot  { width: 6px; height: 6px; border-radius: 50%; background: var(--grad-btn); }
  .stat-label { font-size: 12px; color: var(--text-muted); }
  .stat-val   { font-size: 12px; font-weight: 600; color: var(--text); font-family: var(--mono); }

  /* table card */
  .table-card {
    background: linear-gradient(180deg, rgba(17,20,36,0.9) 0%, rgba(12,14,24,0.95) 100%);
    border: 1px solid var(--glass-b);
    border-radius: var(--r);
    overflow: hidden;
    box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .link-table { width: 100%; border-collapse: collapse; }

  .link-table thead {
    background: rgba(255,255,255,0.025);
    border-bottom: 1px solid var(--glass-b);
  }
  .link-table th {
    padding: 13px 16px; text-align: left;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-dim);
    white-space: nowrap; user-select: none;
  }
  .link-table th[data-sort] { cursor: pointer; transition: color var(--trans); }
  .link-table th[data-sort]:hover { color: var(--violet); }
  .th-inner { display: inline-flex; align-items: center; gap: 4px; }
  .sort-arrow { font-size: 10px; opacity: 0.7; }

  .link-table td {
    padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle; font-size: 13px;
  }

  /* row hover glow */
  .link-table tbody tr {
    transition: background var(--trans);
    position: relative;
  }
  .link-table tbody tr::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--grad);
    opacity: 0; transition: opacity var(--trans);
  }
  .link-table tbody tr:hover { background: var(--glass-hover); }
  .link-table tbody tr:hover::before { opacity: 1; }

  /* columns */
  .col-sl      { width: 52px; }
  .col-title   { min-width: 160px; }
  .col-link    { min-width: 220px; }
  .col-info1   { min-width: 120px; }
  .col-info2   { min-width: 120px; }
  .col-tag     { width: 100px; }
  .col-actions { width: 88px; }

  /* SL number */
  .sl-num {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--text-dim);
    background: var(--glass); border: 1px solid var(--glass-b);
    padding: 3px 7px; border-radius: var(--r-xs);
    display: inline-block;
  }

  /* title */
  .cell-title {
    font-weight: 600; font-size: 13.5px; color: var(--text);
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* multi-link cell */
  .cell-links { display: flex; flex-direction: column; gap: 6px; }
  .cell-link-row {
    display: flex; align-items: center; gap: 6px;
    max-width: 280px;
  }
  .cell-link-row a {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px;
    color: var(--indigo); text-decoration: none;
    transition: color var(--trans);
    min-width: 0;
  }
  .cell-link-row a:hover { color: var(--cyan); }
  .link-ext-icon { width: 10px; height: 10px; flex-shrink: 0; opacity: 0.5; }
  .link-badge {
    font-family: var(--font); font-size: 9.5px; font-weight: 600;
    letter-spacing: 0.3px; color: var(--violet);
    background: rgba(124,106,255,0.12); border: 1px solid rgba(124,106,255,0.25);
    border-radius: var(--r-xs); padding: 1px 6px; white-space: nowrap; flex-shrink: 0;
  }
  .link-url-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more-badge {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    background: var(--glass); border: 1px solid var(--glass-b);
    border-radius: var(--r-xs); padding: 1px 7px; display: inline-block;
  }

  /* info */
  .cell-info {
    color: var(--text-muted); font-size: 12.5px;
    max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* tag */
  .tag-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.2px; white-space: nowrap;
    padding: 3px 10px; border-radius: 99px;
    background: linear-gradient(135deg, rgba(124,106,255,0.15), rgba(6,214,200,0.12));
    border: 1px solid rgba(124,106,255,0.3);
    color: #c4b5fd;
  }
  .tag-pill::before { content: '#'; opacity: 0.5; font-size: 10px; }

  /* action buttons */
  .action-group { display: flex; gap: 6px; }
  .btn-action {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: var(--r-xs);
    border: 1px solid var(--glass-b); background: var(--glass);
    cursor: pointer; transition: all var(--trans);
    color: var(--text-dim);
  }
  .btn-action svg { width: 13px; height: 13px; }
  .btn-action.edit:hover  { color: var(--amber); border-color: rgba(245,166,35,0.4); background: rgba(245,166,35,0.08); box-shadow: 0 0 10px rgba(245,166,35,0.15); }
  .btn-action.del:hover   { color: var(--red);   border-color: rgba(255,82,114,0.4); background: rgba(255,82,114,0.08); box-shadow: 0 0 10px rgba(255,82,114,0.15); }

  /* dash for empty cells */
  .dash { color: var(--text-dim); font-size: 12px; }

  /* ── Empty state ── */
  .empty-state {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 90px 24px; gap: 16px; text-align: center;
  }
  .empty-state.visible { display: flex; }
  .empty-orb {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(124,106,255,0.15), rgba(6,214,200,0.1));
    border: 1px solid var(--glass-b);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 4px;
    box-shadow: 0 0 40px rgba(124,106,255,0.15);
  }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .empty-sub   { font-size: 13px; color: var(--text-muted); max-width: 280px; line-height: 1.6; }

  /* ══════════════════════════════════════════════════════════
     MODAL
  ══════════════════════════════════════════════════════════ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 400;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    width: 100%; max-width: 560px; max-height: 90vh;
    background: linear-gradient(160deg, #12152a 0%, #0c0e1c 100%);
    border: 1px solid var(--glass-b2);
    border-radius: calc(var(--r) + 4px);
    box-shadow: var(--shadow-lg), 0 0 80px rgba(124,106,255,0.12);
    display: flex; flex-direction: column;
    transform: translateY(20px) scale(0.97);
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease;
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }

  /* accent top bar */
  .modal-accent {
    height: 3px; width: 100%;
    background: var(--grad-btn);
    border-radius: calc(var(--r) + 4px) calc(var(--r) + 4px) 0 0;
    flex-shrink: 0;
  }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 16px; flex-shrink: 0;
    border-bottom: 1px solid var(--glass-b);
  }
  .modal-title-wrap {}
  .modal-title {
    font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: var(--text);
  }
  .modal-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .btn-close {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--glass-b); background: var(--glass);
    color: var(--text-dim); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: color var(--trans), background var(--trans), border-color var(--trans);
  }
  .btn-close:hover { color: var(--text); background: var(--glass-hover); border-color: var(--glass-b2); }

  .modal-body {
    padding: 20px 24px; display: flex; flex-direction: column;
    gap: 16px; overflow-y: auto;
  }
  /* custom scrollbar inside modal */
  .modal-body::-webkit-scrollbar { width: 4px; }
  .modal-body::-webkit-scrollbar-track { background: transparent; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--glass-b2); border-radius: 99px; }

  /* form field */
  .field { display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .field-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
  }
  .req { color: var(--pink); font-size: 13px; line-height: 1; }
  .field-hint { font-size: 10.5px; color: var(--text-dim); margin-top: -3px; }

  .input {
    background: rgba(255,255,255,0.04); border: 1px solid var(--glass-b);
    border-radius: var(--r-sm); color: var(--text); font-family: var(--font);
    font-size: 13px; padding: 10px 13px; outline: none; width: 100%;
    transition: border-color var(--trans), background var(--trans), box-shadow var(--trans);
  }
  .input:focus {
    border-color: rgba(124,106,255,0.55);
    background: rgba(124,106,255,0.06);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.1);
  }
  .input::placeholder { color: var(--text-dim); }
  .input.err { border-color: rgba(255,82,114,0.6); box-shadow: 0 0 0 3px rgba(255,82,114,0.08); }

  .input-mono { font-family: var(--mono); font-size: 12px; }

  .field-err { font-size: 11px; color: var(--red); min-height: 15px; display: flex; align-items: center; gap: 4px; }
  .field-err::before { content: '!'; width: 13px; height: 13px; border-radius: 50%; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .field-err:empty::before { display: none; }

  .field-row { display: flex; gap: 12px; }

  /* divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--text-dim);
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--glass-b);
  }

  /* URL rows */
  .url-col-head {
    display: grid; grid-template-columns: 110px 1fr 32px;
    gap: 6px; font-size: 10px; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--text-dim); padding: 0 2px;
  }
  .url-list { display: flex; flex-direction: column; gap: 6px; }
  .url-row  { display: grid; grid-template-columns: 110px 1fr 32px; gap: 6px; align-items: center; }

  .url-label-inp {
    background: rgba(255,255,255,0.04); border: 1px solid var(--glass-b);
    border-radius: var(--r-sm); color: var(--text); font-family: var(--font);
    font-size: 12px; padding: 9px 10px; outline: none;
    transition: border-color var(--trans), background var(--trans);
  }
  .url-label-inp:focus { border-color: rgba(124,106,255,0.5); background: rgba(124,106,255,0.05); }
  .url-label-inp::placeholder { color: var(--text-dim); }

  .url-inp {
    background: rgba(255,255,255,0.04); border: 1px solid var(--glass-b);
    border-radius: var(--r-sm); color: var(--text); font-family: var(--mono);
    font-size: 11.5px; padding: 9px 10px; outline: none; width: 100%;
    transition: border-color var(--trans), background var(--trans), box-shadow var(--trans);
  }
  .url-inp:focus { border-color: rgba(124,106,255,0.5); background: rgba(124,106,255,0.05); box-shadow: 0 0 0 3px rgba(124,106,255,0.08); }
  .url-inp::placeholder { color: var(--text-dim); font-family: var(--font); font-size: 12px; }
  .url-inp.err { border-color: rgba(255,82,114,0.6); }

  .btn-rm-url {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: var(--r-xs);
    border: 1px solid var(--glass-b); background: var(--glass);
    cursor: pointer; color: var(--text-dim);
    transition: all var(--trans);
  }
  .btn-rm-url:hover { color: var(--red); border-color: rgba(255,82,114,0.4); background: rgba(255,82,114,0.08); }
  .btn-rm-url svg { width: 11px; height: 11px; }

  .btn-add-url {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; padding: 9px; border-radius: var(--r-sm);
    border: 1px dashed rgba(124,106,255,0.25); background: rgba(124,106,255,0.04);
    color: var(--text-muted); font-family: var(--font); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all var(--trans);
  }
  .btn-add-url:hover { border-color: rgba(124,106,255,0.5); background: rgba(124,106,255,0.08); color: var(--violet); }
  .btn-add-url svg { width: 13px; height: 13px; }

  /* modal footer */
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 16px 24px 20px; border-top: 1px solid var(--glass-b); flex-shrink: 0;
  }
  .btn-ghost {
    padding: 9px 18px; border-radius: var(--r-sm);
    border: 1px solid var(--glass-b); background: var(--glass);
    color: var(--text-muted); font-family: var(--font); font-size: 13px;
    cursor: pointer; transition: all var(--trans);
  }
  .btn-ghost:hover { border-color: var(--glass-b2); color: var(--text); background: var(--glass-hover); }

  /* kbd hint */
  .kbd { font-family: var(--mono); font-size: 10px; color: var(--text-dim);
         background: var(--glass); border: 1px solid var(--glass-b);
         padding: 1px 5px; border-radius: 4px; }

  /* ══════════════════════════════════════════════════════════
     TOAST
  ══════════════════════════════════════════════════════════ */
  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(70px);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    background: rgba(18,21,42,0.92);
    border: 1px solid var(--glass-b2);
    padding: 11px 22px 11px 16px; border-radius: 99px;
    font-size: 13px; font-weight: 500; white-space: nowrap;
    box-shadow: var(--shadow-md); opacity: 0; z-index: 9999;
    transition: opacity 0.22s ease, transform 0.22s ease;
    display: flex; align-items: center; gap: 9px; color: var(--text);
  }
  .toast.show    { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success .toast-dot { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
  .toast.error   .toast-dot { background: var(--red);     box-shadow: 0 0 8px var(--red); }
  .toast-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* ══════════════════════════════════════════════════════════
     SCROLLBAR
  ══════════════════════════════════════════════════════════ */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--glass-b2); border-radius: 99px; }

  /* ══════════════════════════════════════════════════════════
     RESPONSIVE
  ══════════════════════════════════════════════════════════ */
  @media (max-width: 800px) {
    .header-inner, .toolbar-inner, .table-wrap { padding-left: 16px; padding-right: 16px; }
    .col-info2, .col-tag { display: none; }
    .field-row { flex-direction: column; }
    .url-col-head, .url-row { grid-template-columns: 90px 1fr 32px; }
    .url-label-inp { font-size: 11px; }
    .logo-version { display: none; }
    .count-badge  { display: none; }
  }
  @media (max-width: 520px) {
    .col-info1 { display: none; }
    .btn-primary span { display: none; }
  }
  </style>
</head>
<body>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header class="app-header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🔗</div>
      <span class="logo-text">LinkVault</span>
      <span class="logo-version">v2</span>
    </div>
    <div class="header-right">
      <span class="count-badge" id="linkCount">0 entries</span>
      <button class="btn-primary" id="openModalBtn">
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Add Link</span>
      </button>
    </div>
  </div>
</header>

<!-- ═══════════════════ TOOLBAR ═══════════════════ -->
<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none">
        <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/>
        <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search anything…"/>
    </div>
    <select id="filterTag" class="filter-select">
      <option value="">All tags</option>
    </select>
    <button class="icon-btn" id="exportBtn" title="Export JSON">
      <svg viewBox="0 0 20 20" fill="none"><path d="M10 3v10M6 9l4 4 4-4M4 16h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <label class="icon-btn" title="Import JSON" style="cursor:pointer">
      <svg viewBox="0 0 20 20" fill="none"><path d="M10 17V7M6 11l4-4 4 4M4 4h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <input type="file" id="importFile" accept=".json" style="display:none"/>
    </label>
  </div>
</div>

<!-- ═══════════════════ TABLE ═══════════════════ -->
<main class="table-wrap">

  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat-item">
      <div class="stat-dot"></div>
      <span class="stat-label">Total</span>
      <span class="stat-val" id="statTotal">0</span>
    </div>
    <div class="stat-item" id="statFilterWrap" style="display:none">
      <div class="stat-dot" style="background:var(--cyan)"></div>
      <span class="stat-label">Showing</span>
      <span class="stat-val" id="statShowing">0</span>
    </div>
  </div>

  <div class="table-card">
    <table class="link-table" id="linkTable">
      <thead>
        <tr>
          <th class="col-sl">#</th>
          <th class="col-title" data-sort="title">
            <div class="th-inner">Title<span class="sort-arrow"></span></div>
          </th>
          <th class="col-link">Links</th>
          <th class="col-info1" data-sort="info1">
            <div class="th-inner">Info 1<span class="sort-arrow"></span></div>
          </th>
          <th class="col-info2" data-sort="info2">
            <div class="th-inner">Info 2<span class="sort-arrow"></span></div>
          </th>
          <th class="col-tag" data-sort="tag">
            <div class="th-inner">Tag<span class="sort-arrow"></span></div>
          </th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="empty-state" id="emptyState">
      <div class="empty-orb">🔗</div>
      <div class="empty-title">No links saved yet</div>
      <div class="empty-sub">Hit <strong>Add Link</strong> to start building your personal link library.</div>
    </div>
  </div>
</main>

<!-- ═══════════════════ MODAL ═══════════════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-accent"></div>
    <div class="modal-header">
      <div class="modal-title-wrap">
        <div class="modal-title" id="modalTitle">Add Link</div>
        <div class="modal-subtitle">All URLs saved to your local browser storage</div>
      </div>
      <button class="btn-close" id="closeModalBtn" title="Close (Esc)">✕</button>
    </div>

    <div class="modal-body">

      <!-- Title -->
      <div class="field">
        <label class="field-label" for="inputTitle">Title <span class="req">*</span></label>
        <input class="input" type="text" id="inputTitle" placeholder="e.g. MDN Web Docs"/>
        <div class="field-err" id="errTitle"></div>
      </div>

      <div class="section-divider">URLs</div>

      <!-- URL rows -->
      <div class="field">
        <div class="url-col-head">
          <span>Label</span><span>URL</span><span></span>
        </div>
        <div class="url-list" id="urlList"></div>
        <button type="button" class="btn-add-url" id="addUrlBtn">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Add another URL
        </button>
        <div class="field-err" id="errUrls"></div>
      </div>

      <div class="section-divider">Details</div>

      <!-- Info row -->
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="inputInfo1">Info 1</label>
          <input class="input" type="text" id="inputInfo1" placeholder="Category, author…"/>
        </div>
        <div class="field">
          <label class="field-label" for="inputInfo2">Info 2</label>
          <input class="input" type="text" id="inputInfo2" placeholder="Date, status…"/>
        </div>
      </div>

      <!-- Tag -->
      <div class="field">
        <label class="field-label" for="inputTag">Tag</label>
        <input class="input" type="text" id="inputTag" placeholder="design, dev, reference…"/>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 9l4 4 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Save Link
        <span class="kbd">⌘↵</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════ TOAST ═══════════════════ -->
<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toastMsg"></span>
</div>

<!-- ═══════════════════ SCRIPT ═══════════════════ -->
<script>
(function(){
'use strict';

const STORAGE_KEY = 'linkvault_v2';
const loadLinks = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } };
const saveLinks = l => localStorage.setItem(STORAGE_KEY, JSON.stringify(l));

/* ── State ── */
let links = loadLinks();
let editingId = null, sortKey = null, sortDir = 1, filterQuery = '', filterTag = '';

/* ── DOM ── */
const $ = id => document.getElementById(id);
const tableBody    = $('tableBody');
const emptyState   = $('emptyState');
const statsBar     = $('statsBar');
const statTotal    = $('statTotal');
const statShowing  = $('statShowing');
const statFilterWrap = $('statFilterWrap');
const linkCount    = $('linkCount');
const searchInput  = $('searchInput');
const filterSelect = $('filterTag');
const modalOverlay = $('modalOverlay');
const modalTitle   = $('modalTitle');
const openModalBtn = $('openModalBtn');
const closeModalBtn= $('closeModalBtn');
const cancelBtn    = $('cancelBtn');
const saveBtn      = $('saveBtn');
const exportBtn    = $('exportBtn');
const importFile   = $('importFile');
const toast        = $('toast');
const toastMsg     = $('toastMsg');
const inputTitle   = $('inputTitle');
const inputInfo1   = $('inputInfo1');
const inputInfo2   = $('inputInfo2');
const inputTag     = $('inputTag');
const errTitle     = $('errTitle');
const errUrls      = $('errUrls');
const urlList      = $('urlList');
const addUrlBtn    = $('addUrlBtn');

/* ── Utils ── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const isURL = s => { try { new URL(s); return true; } catch { return false; } };

/* ── Toast ── */
let toastTimer;
function showToast(msg, type='success') {
  toastMsg.textContent = msg;
  toast.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

/* ══ URL ROWS ══ */
function buildUrlRow(labelVal='', urlVal='') {
  const row = document.createElement('div');
  row.className = 'url-row';
  const lInp = document.createElement('input');
  lInp.type = 'text'; lInp.className = 'url-label-inp';
  lInp.placeholder = 'Label (opt.)'; lInp.maxLength = 30; lInp.value = labelVal;

  const uInp = document.createElement('input');
  uInp.type = 'url'; uInp.className = 'url-inp';
  uInp.placeholder = 'https://…'; uInp.value = urlVal;

  const rmBtn = document.createElement('button');
  rmBtn.type = 'button'; rmBtn.className = 'btn-rm-url'; rmBtn.title = 'Remove';
  rmBtn.innerHTML = `<svg viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  rmBtn.addEventListener('click', () => {
    if (urlList.children.length > 1) { row.remove(); }
    else { lInp.value = ''; uInp.value = ''; uInp.classList.remove('err'); }
  });

  row.append(lInp, uInp, rmBtn);
  return row;
}

function populateUrlList(urls) {
  urlList.innerHTML = '';
  if (!urls || !urls.length) { urlList.appendChild(buildUrlRow()); return; }
  urls.forEach(u => urlList.appendChild(buildUrlRow(u.label||'', u.url||'')));
}

addUrlBtn.addEventListener('click', () => {
  const row = buildUrlRow();
  urlList.appendChild(row);
  row.querySelector('.url-inp').focus();
});

/* ══ MODAL ══ */
function openModal(entry=null) {
  editingId = entry?.id || null;
  modalTitle.textContent = entry ? 'Edit Link' : 'Add Link';
  inputTitle.value = entry?.title || '';
  inputInfo1.value = entry?.info1 || '';
  inputInfo2.value = entry?.info2 || '';
  inputTag.value   = entry?.tag   || '';
  populateUrlList(entry?.urls);
  clearErrors();
  modalOverlay.classList.add('open');
  setTimeout(() => inputTitle.focus(), 100);
}

function closeModal() { modalOverlay.classList.remove('open'); editingId = null; }

function clearErrors() {
  errTitle.textContent = '';
  errUrls.textContent  = '';
  inputTitle.classList.remove('err');
  urlList.querySelectorAll('.url-inp').forEach(i => i.classList.remove('err'));
}

/* ══ SAVE ══ */
function handleSave() {
  clearErrors();
  let valid = true;
  const title = inputTitle.value.trim();
  const info1 = inputInfo1.value.trim();
  const info2 = inputInfo2.value.trim();
  const tag   = inputTag.value.trim().toLowerCase();
  const urlRows = [...urlList.querySelectorAll('.url-row')];

  if (!title) {
    errTitle.textContent = 'Title is required.';
    inputTitle.classList.add('err');
    valid = false;
  }

  let hasAny = false;
  urlRows.forEach(row => {
    const inp = row.querySelector('.url-inp');
    const val = inp.value.trim();
    if (!val) return;
    hasAny = true;
    if (!isURL(val)) { inp.classList.add('err'); errUrls.textContent = 'One or more URLs are invalid.'; valid = false; }
  });
  if (!hasAny) {
    urlList.querySelector('.url-inp').classList.add('err');
    errUrls.textContent = 'At least one URL is required.';
    valid = false;
  }
  if (!valid) return;

  const urls = urlRows
    .map(r => ({ label: r.querySelector('.url-label-inp').value.trim(), url: r.querySelector('.url-inp').value.trim() }))
    .filter(u => u.url);

  if (editingId) {
    const idx = links.findIndex(l => l.id === editingId);
    if (idx !== -1) { links[idx] = { ...links[idx], title, urls, info1, info2, tag, updatedAt: Date.now() }; showToast('Link updated ✓'); }
  } else {
    links.push({ id: uid(), title, urls, info1, info2, tag, createdAt: Date.now(), updatedAt: Date.now() });
    showToast('Link saved ✓');
  }
  saveLinks(links); closeModal(); render();
}

/* ── Delete ── */
function handleDelete(id) {
  if (!confirm('Delete this entry?')) return;
  links = links.filter(l => l.id !== id);
  saveLinks(links); render();
  showToast('Entry deleted', 'error');
}

/* ── Sort ── */
function handleSort(key) {
  sortDir = sortKey === key ? sortDir * -1 : 1; sortKey = key; render();
}

/* ── Filter ── */
function getFiltered() {
  let result = [...links];
  if (filterQuery) {
    const q = filterQuery.toLowerCase();
    result = result.filter(l =>
      l.title.toLowerCase().includes(q) || l.info1.toLowerCase().includes(q) ||
      l.info2.toLowerCase().includes(q) || l.tag.toLowerCase().includes(q) ||
      (l.urls||[]).some(u => u.url.toLowerCase().includes(q)||(u.label||'').toLowerCase().includes(q))
    );
  }
  if (filterTag) result = result.filter(l => l.tag === filterTag);
  if (sortKey) {
    result.sort((a,b) => {
      const va=(a[sortKey]||'').toString().toLowerCase(), vb=(b[sortKey]||'').toString().toLowerCase();
      return va<vb ? -sortDir : va>vb ? sortDir : 0;
    });
  }
  return result;
}

/* ── Tag dropdown ── */
function refreshTagFilter() {
  const tags=[...new Set(links.map(l=>l.tag).filter(Boolean))].sort();
  const cur=filterSelect.value;
  filterSelect.innerHTML='<option value="">All tags</option>';
  tags.forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; filterSelect.appendChild(o); });
  filterSelect.value=tags.includes(cur)?cur:'';
}

/* ── Links cell ── */
function renderLinksCell(urls) {
  if (!urls||!urls.length) return '<span class="dash">—</span>';
  const MAX=3, shown=urls.slice(0,MAX), rest=urls.length-MAX;
  let h='<div class="cell-links">';
  shown.forEach((u,i)=>{
    const lbl=u.label||`Link ${i+1}`;
    h+=`<div class="cell-link-row">
      <a href="${esc(u.url)}" target="_blank" rel="noopener noreferrer" title="${esc(u.url)}">
        <span class="link-badge">${esc(lbl)}</span>
        <span class="link-url-text">${esc(u.url)}</span>
        <svg class="link-ext-icon" viewBox="0 0 12 12" fill="none"><path d="M2 10L10 2M5 2h5v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>`;
  });
  if (rest>0) h+=`<span class="more-badge">+${rest} more</span>`;
  h+='</div>'; return h;
}

/* ── Render ── */
function render() {
  refreshTagFilter();
  const rows=getFiltered();
  const n=links.length;
  linkCount.textContent=`${n} entr${n!==1?'ies':'y'}`;
  statTotal.textContent=n;

  if (n>0) statsBar.style.display='flex'; else statsBar.style.display='none';

  const isFiltering = filterQuery||filterTag;
  if (isFiltering) {
    statFilterWrap.style.display='flex';
    statShowing.textContent=rows.length;
  } else {
    statFilterWrap.style.display='none';
  }

  document.querySelectorAll('.link-table th[data-sort]').forEach(th=>{
    const arrow=th.querySelector('.sort-arrow');
    if(!arrow) return;
    arrow.textContent=th.dataset.sort===sortKey?(sortDir===1?' ↑':' ↓'):'';
  });

  if (!rows.length) {
    tableBody.innerHTML=''; emptyState.classList.add('visible'); return;
  }
  emptyState.classList.remove('visible');

  tableBody.innerHTML=rows.map((e,i)=>`
    <tr data-id="${esc(e.id)}">
      <td class="col-sl"><span class="sl-num">${String(i+1).padStart(2,'0')}</span></td>
      <td class="col-title"><div class="cell-title" title="${esc(e.title)}">${esc(e.title)}</div></td>
      <td class="col-link">${renderLinksCell(e.urls)}</td>
      <td class="col-info1"><div class="cell-info" title="${esc(e.info1)}">${esc(e.info1)||'<span class="dash">—</span>'}</div></td>
      <td class="col-info2"><div class="cell-info" title="${esc(e.info2)}">${esc(e.info2)||'<span class="dash">—</span>'}</div></td>
      <td class="col-tag">${e.tag?`<span class="tag-pill">${esc(e.tag)}</span>`:'<span class="dash">—</span>'}</td>
      <td class="col-actions">
        <div class="action-group">
          <button class="btn-action edit" data-id="${esc(e.id)}" title="Edit">
            <svg viewBox="0 0 16 16" fill="none"><path d="M11 2l3 3-8 8H3v-3l8-8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn-action del" data-id="${esc(e.id)}" title="Delete">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6 4V3h4v1M5 4l1 9h4l1-9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </td>
    </tr>
  `).join('');
}

/* ── Migrate ── */
function migrate() {
  let changed=false;
  links=links.map(l=>{ if(!l.urls){ changed=true; return {...l, urls:l.url?[{label:'',url:l.url}]:[]}; } return l; });
  if(changed) saveLinks(links);
}

/* ── Events ── */
tableBody.addEventListener('click', e=>{
  const eb=e.target.closest('.btn-action.edit'), db=e.target.closest('.btn-action.del');
  if(eb){ const en=links.find(l=>l.id===eb.dataset.id); if(en) openModal(en); }
  if(db) handleDelete(db.dataset.id);
});
document.querySelectorAll('.link-table th[data-sort]').forEach(th=>th.addEventListener('click',()=>handleSort(th.dataset.sort)));
searchInput.addEventListener('input',()=>{ filterQuery=searchInput.value.trim(); render(); });
filterSelect.addEventListener('change',()=>{ filterTag=filterSelect.value; render(); });
openModalBtn.addEventListener('click',()=>openModal());
closeModalBtn.addEventListener('click',closeModal);
cancelBtn.addEventListener('click',closeModal);
saveBtn.addEventListener('click',handleSave);
modalOverlay.addEventListener('click',e=>{ if(e.target===modalOverlay) closeModal(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&modalOverlay.classList.contains('open')) handleSave();
});

exportBtn.addEventListener('click',()=>{
  if(!links.length){showToast('Nothing to export','error');return;}
  const blob=new Blob([JSON.stringify(links,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`linkvault-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  showToast(`Exported ${links.length} entries ✓`);
});

importFile.addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imp=JSON.parse(ev.target.result);
      if(!Array.isArray(imp)) throw new Error();
      const ids=new Set(links.map(l=>l.id));
      const fresh=imp.filter(l=>l.title&&!ids.has(l.id));
      links=[...links,...fresh]; migrate(); saveLinks(links); render();
      showToast(`Imported ${fresh.length} entr${fresh.length!==1?'ies':'y'} ✓`);
    } catch { showToast('Invalid JSON file','error'); }
    importFile.value='';
  };
  reader.readAsText(file);
});

migrate(); render();
})();
</script>
</body>
</html>
